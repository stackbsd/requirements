name: "Unit tests"

on:
  workflow_call:
    inputs:
      packages:
        description: "Packages to install at the locked versions"
        type: string
        required: true
      test:
        description: "Command that runs the tests"
        type: string
        default: "python -m unittest discover -s tests -t ."
      lock-ref:
        description: "Ref of stackbsd/requirements to take the lock from"
        type: string
        default: main
      release:
        description: "FreeBSD release of the test VM"
        type: string
        default: "15.1"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Check formatting
        run: uvx ruff format --check .
      - name: Lint
        run: uvx ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout the lock
        uses: actions/checkout@v7
        with:
          repository: stackbsd/requirements
          ref: ${{ inputs.lock-ref }}
          path: .ci/requirements
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Export the lock as constraints
        run: >
          uv export --project .ci/requirements --frozen --no-hashes
          --no-emit-project -o .ci/constraints.txt
      - name: Build the wheel
        run: uv build --wheel -o .ci/dist
      - name: Restore wheels
        id: wheels
        uses: actions/cache/restore@v6
        with:
          path: .ci/wheels
          key: wheels-${{ inputs.release }}-${{ inputs.packages }}-${{ hashFiles('.ci/requirements/uv.lock') }}
      - name: Start FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.release }}
          cache-after-prepare: true
          prepare: |
            pkg install -y python312 py312-sqlite3 rust pkgconf ninja libffi \
              libxml2 libxslt libyaml openblas
            python3.12 -m venv /opt/venv
      - name: Build wheels
        if: steps.wheels.outputs.cache-hit != 'true'
        shell: freebsd {0}
        run: >
          /opt/venv/bin/pip wheel --wheel-dir .ci/wheels
          -c .ci/constraints.txt ${{ inputs.packages }}
      - name: Save wheels
        if: steps.wheels.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci/wheels
          key: ${{ steps.wheels.outputs.cache-primary-key }}
      - name: Install
        shell: freebsd {0}
        run: |
          /opt/venv/bin/pip install --no-index --find-links .ci/wheels \
            -c .ci/constraints.txt ${{ inputs.packages }}
          /opt/venv/bin/pip install --no-index --no-deps .ci/dist/*.whl
      - name: Test
        shell: freebsd {0}
        run: |
          export PATH=/opt/venv/bin:$PATH
          ${{ inputs.test }}
